<!-- manager.html：表格页（v2 新排版：一次看一张表） -->
<div class="v2u-data" id="table_manager_container">
    <div id="tableEditTips" style="display:none"></div>
    <!-- 楼层 -->
    <div class="v2u-floor">
        <div class="v2u-stepper">
            <button type="button" id="table_prev_button" class="v2u-icon-btn" title="上一个有表格的楼层" aria-label="上一个有表格的楼层"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="table_indicator">最新</span>
            <button type="button" id="table_next_button" class="v2u-icon-btn" title="下一个有表格的楼层" aria-label="下一个有表格的楼层"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <input type="number" id="table_jump_input" placeholder="楼层" class="v2u-input" inputmode="numeric" aria-label="跳到第几楼">
        <button type="button" id="table_jump_button" class="v2u-btn">跳转</button>
        <button type="button" id="table_latest_button" class="v2u-btn" style="display:none">回到最新</button>
    </div>
    <div id="v2u_old_floor_tip" class="v2u-tip" style="display:none"></div>
    <!-- 选哪张表 -->
    <div id="v2u_sheet_chips" class="v2u-chips"></div>
    <!-- 这张表的工具 -->
    <div class="v2u-tools">
        <label class="v2u-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="v2u_sheet_search" placeholder="搜这张表" autocomplete="off"></label>
        <button type="button" id="v2u_add_row" class="v2u-btn"><i class="fa-solid fa-plus"></i><span>加一行</span></button>
        <button type="button" id="v2u_more_button" class="v2u-icon-btn" aria-label="更多操作" title="更多操作"><i class="fa-solid fa-ellipsis"></i></button>
    </div>
    <!-- 更多操作：原来那排没字的图标，现在都带字 -->
    <div id="v2u_more_panel" class="v2u-more-panel" style="display:none">
        <button type="button" class="v2u-btn" id="table_data_statistics_button"><i class="fa-solid fa-ranking-star"></i><span>数据统计</span></button>
        <button type="button" class="v2u-btn" id="dataTable_history_button"><i class="fa-solid fa-clock-rotate-left"></i><span>编辑历史</span></button>
        <button type="button" class="v2u-btn" id="table_undo"><i class="fa-solid fa-rotate-left"></i><span>撤销本轮修改</span></button>
        <button type="button" class="v2u-btn" id="table_rebuild_button"><i class="fa-solid fa-repeat"></i><span>表格整理</span></button>
        <button type="button" class="v2u-btn" id="copy_table_button"><i class="fa-solid fa-copy"></i><span>复制表格</span></button>
        <button type="button" class="v2u-btn" id="import_table_button"><i class="fa-solid fa-file-import"></i><span>导入表格</span></button>
        <button type="button" class="v2u-btn" id="export_table_button"><i class="fa-solid fa-file-export"></i><span>导出表格</span></button>
        <button type="button" class="v2u-btn is-danger" id="clear_table_button"><i class="fa-solid fa-trash-can"></i><span>清空表格</span></button>
    </div>
    <div class="v2u-subbar">
        <span id="v2u_sheet_info"></span>
        <div class="v2u-seg" id="v2u_view_switch" role="group" aria-label="显示方式">
            <button type="button" data-view="card">卡片</button>
            <button type="button" data-view="wide">表格</button>
        </div>
    </div>
    <div id="contentContainer">
        <div id="tableContainer"></div>
    </div>
</div>
