<div id="table_database_settings_drawer" class="drawer">
    <div class="drawer-toggle">
        <div id="table_drawer_icon" class="drawer-icon fa-solid fa-bars-progress fa-fw closedIcon interactable" title="增强记忆表格" data-i18n="[title]Event table" tabindex="0"></div>
    </div>
    <div id="table_drawer_content" class="drawer-content closedDrawer">
        <div id="v2u_shell" class="v2u">
            <!-- 各个页面的内容 -->
            <div id="app_header_table_container"></div>
            <!-- 底部导航：拇指够得到 -->
            <nav id="table_button_container" class="v2u-nav">
                <button type="button" id="overview_button" class="v2u-tab"><i class="fa-solid fa-house"></i><span>总览</span></button>
                <button type="button" id="database_button" class="v2u-tab"><i class="fa-solid fa-table-list"></i><span>表格</span></button>
                <button type="button" id="roles_button" class="v2u-tab"><i class="fa-solid fa-users"></i><span>角色</span></button>
                <button type="button" id="editor_button" class="v2u-tab"><i class="fa-solid fa-pen-ruler"></i><span data-i18n="Template">模板</span></button>
                <button type="button" id="setting_button" class="v2u-tab"><i class="fa-solid fa-sliders"></i><span data-i18n="Settings">设置</span>
                    <b id="setting_button_new_tag" class="v2u-tab-new" style="display: none;">New</b>
                </button>
            </nav>
            <!-- 底部弹层（整屏阅读、菜单）挂在抽屉里面，点它不会让酒馆把抽屉收起来 -->
            <div id="v2u_sheet_host"></div>
        </div>
    </div>
</div>
